
client_max_body_size 11m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($uri ~* \.(bak|old|orig|save)$) { return 404; }

    location = /uis/backoffice { return 302 /uis/backoffice/; }

    location = /uis/web/ { return 302 /uis/backoffice/$is_args$args; }
    location = /uis/web/index.html { return 302 /uis/backoffice/$is_args$args; }

    location ~ ^/uis/web/(login|register|forgot-password|reset-password|account/profile|account/change-password)(/index\.html|/)?$ {
        return 302 /uis/backoffice/$1/$is_args$args;
    }

    location ^~ /uis/backoffice/assets/ {
        try_files $uri =404;
    }

    location ^~ /uis/backoffice/ {
        proxy_pass http://backoffice:3002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /uis/application/app/suppliers/ { return 302 /uis/backoffice/suppliers/; }
    location /uis/application/ { return 302 /uis/backoffice/; }

    location /backend/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|mjs|json|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}

