<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasaland Web | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="login">
  <div class="grain"></div>
  <header class="topbar">
    <h1>Brasaland Web</h1>
    <a id="toRegister" class="ghost-link" href="../register/">Ir a registro</a>
  </header>

  <main class="layout">
    <section class="panel auth-panel">
      <h2>/login</h2>
      <p class="muted">Accede para entrar a la vista autenticada principal.</p>

      <label class="api-url">
        API base URL
        <input id="apiBaseUrl" type="text" value="http://127.0.0.1:8000" />
      </label>

      <form id="loginForm" class="auth-form">
        <label>
          Email
          <input name="email" type="email" required />
          <small class="status error" data-field-error="email"></small>
        </label>

        <label>
          Contraseña
          <input name="password" type="password" required />
          <small class="status error" data-field-error="password"></small>
        </label>

        <button type="submit" class="btn primary">Iniciar sesión</button>
      </form>

      <p class="muted"><a id="toForgotPassword" class="ghost-link" href="../forgot-password/">¿Olvidaste tu contraseña?</a></p>

      <p id="statusMessage" class="status"></p>
    </section>
  </main>

  <script src="../auth-pages.js"></script>
</body>
</html>
