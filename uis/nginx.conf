server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /uis/web/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /uis/backoffice/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}