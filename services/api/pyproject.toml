[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "brasaland-ops-api"
version = "0.1.0"
description = "FastAPI + TinyDB API for incidents and suppliers"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "python-multipart==0.0.20",
  "tinydb==4.8.2",
  "python-dotenv>=1.0.1",
  "sqlmodel>=0.0.47,<0.1",
  "psycopg[binary]>=3.2,<4",
  "python-jose[cryptography]==3.5.0",
  "bcrypt>=5.0.0,<6",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
seed = "seed:main"
seed-admin = "seed_admin:main"

[tool.hatch.build.targets.wheel]
include = [
  "seed.py",
  "main.py",
  "auth.py",
  "stores.py",
  "user_service.py",
  "models.py",
  "database.py",
  "init_db.py",
  "seed_admin.py",
  "schemas.py",
  "routes/*.py"
]
