<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Regístrate en Brasa Points para acumular puntos en Brasaland y disfrutar de descuentos y beneficios en nuestras 14 ubicaciones.">
  <title>Registro Brasaland</title>
  <link rel="stylesheet" href="uis/web/public.min.css?v=public-20261026">
</head>

<body class="public-site registration-page">
<a class="skip-link" href="#registration-main">Ir al contenido principal</a>

<header class="public-header">
  <div class="public-container header-inner">
    <p class="public-brand">Brasaland 🔥<span class="brand-rule" aria-hidden="true"></span></p>
    <a href="index.html" class="public-text-link">← Volver</a>
  </div>
</header>

<main id="registration-main" class="public-container registration-layout">

<div class="registration-intro">
<h1>
  Registro Brasa Points
</h1>

<div class="registration-benefits">
  <ul>
    <li>Acumula 1 punto por cada $10.000 COP o $5 USD</li>
    <li>Canjea tus puntos por descuentos y platos gratis</li>
    <li>Ofertas exclusivas para miembros</li>
    <li>Registro 100% digital - ¡ya no más tarjetas de papel!</li>
  </ul>
</div>
</div>

<form id="form" class="registration-form">

<div class="public-field field-wide"><label for="name">Nombre completo</label>
<input id="name" aria-label="Nombre completo" autocomplete="name" placeholder="Nombre completo" aria-describedby="error-name">
<p id="error-name" class="field-error" aria-live="polite"></p></div>

<div class="public-field"><label for="email">Email</label>
<input id="email" aria-label="Email" autocomplete="email" placeholder="Email" aria-describedby="error-email">
<p id="error-email" class="field-error" aria-live="polite"></p></div>

<div class="public-field"><label for="phone">Teléfono</label>
<input id="phone" aria-label="Teléfono" autocomplete="tel" placeholder="+57 o +1" aria-describedby="error-phone">
<p id="error-phone" class="field-error" aria-live="polite"></p></div>

<div class="public-field"><label for="country">País</label>
<select id="country" aria-label="País" aria-describedby="error-country">
  <option value="">País</option>
</select>
<p id="error-country" class="field-error" aria-live="polite"></p></div>

<div class="public-field"><label for="city">Ciudad</label>
<select id="city" aria-label="Ciudad" aria-describedby="error-city">
  <option value="">Ciudad</option>
</select>
<p id="error-city" class="field-error" aria-live="polite"></p></div>

<div class="public-field field-wide"><label for="location">Ubicación</label>
<select id="location" aria-label="Ubicación" aria-describedby="error-location">
  <option value="">Ubicación</option>
</select>
<p id="error-location" class="field-error" aria-live="polite"></p></div>

<div class="public-field field-wide"><label for="dietary-preferences">Preferencias alimenticias</label>
<select id="dietary-preferences" aria-label="Preferencias alimenticias">
  <option value="">Preferencias Alimenticias</option>
  <option value="Frutas y verduras (como base)">Frutas y verduras (como base)</option>
  <option value="Legumbres (porotos, lentejas, garbanzos)">Legumbres (porotos, lentejas, garbanzos)</option>
  <option value="Carnes magras (pollo, pescado, vaca) cocinadas al horno o plancha">Carnes magras (pollo, pescado, vaca) cocinadas al horno o plancha</option>
  <option value="Alimentos ricos en fibra y granos integrales">Alimentos ricos en fibra y granos integrales</option>
</select>
</div>

<div class="public-field"><label for="birthdate">Fecha de nacimiento</label>
<input id="birthdate" type="date" aria-label="Fecha de nacimiento" autocomplete="bday" aria-describedby="error-birthdate">
<p id="error-birthdate" class="field-error" aria-live="polite"></p></div>

<div class="public-field"><label for="source">Cómo nos conociste</label>
<select id="source" aria-label="Cómo nos conociste" aria-describedby="error-source">
  <option value="">¿Cómo nos conociste?</option>
  <option>Instagram</option>
  <option>Facebook</option>
  <option>Publicidad</option>
</select>
<p id="error-source" class="field-error" aria-live="polite"></p></div>

<div class="field-wide"><label class="terms-label">
  <input type="checkbox" id="terms" aria-describedby="error-terms"> Acepto términos
</label>
<p id="error-terms" class="field-error" aria-live="polite"></p></div>

<button class="public-button field-wide">
  Enviar 🔥
</button>

</form>

</main>

<script src="validation.js" defer></script>

</body>
</html>
