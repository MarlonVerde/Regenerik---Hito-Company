<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salida de inventario | Brasaland Backoffice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles.css">
</head>
<body data-inventory-page="outbound">
  <div class="grain"></div>
  <header class="topbar">
    <h1>Brasaland Ops Console</h1>
    <nav class="menu inventory-nav" aria-label="Navegación de inventario">
      <a href="../../products/">Productos</a>
      <a href="../inbound/">Entrada</a>
      <a href="../outbound/" aria-current="page">Salida</a>
      <a href="../">Historial</a>
      <p id="currentUser" class="current-user"></p>
      <button id="logoutBtn" class="btn" type="button">Cerrar sesión</button>
      <a href="../../../index.html" class="ghost-link">Backoffice</a>
    </nav>
  </header>
  <main class="layout inventory-layout">
    <section class="panel inventory-panel inventory-form-panel">
      <div class="inventory-heading">
        <div><p class="eyebrow">Operaciones / Inventario</p><h2>Registrar salida</h2></div>
        <a class="btn" href="../../products/">Ver productos</a>
      </div>
      <p class="muted">El stock mostrado cambia al seleccionar producto y al ajustar la cantidad.</p>
      <p id="pageStatus" class="status" role="status" aria-live="polite">Cargando productos...</p>
      <form id="outboundForm" class="inventory-form">
        <label>Producto
          <select name="ingredient_id" required><option value="">Selecciona un producto</option></select>
        </label>
        <div class="stock-summary" aria-live="polite">
          <span class="field-label">Stock disponible</span>
          <strong id="selectedStock">Selecciona un producto</strong>
        </div>
        <label>Cantidad a retirar
          <input name="quantity" type="number" min="0.01" step="any" aria-describedby="quantityFeedback" required>
          <small id="quantityFeedback" class="field-feedback"></small>
        </label>
        <label>Motivo
          <select name="reason" required>
            <option value="consumption">Consumo</option>
            <option value="waste">Merma</option>
          </select>
        </label>
        <label>Sede
          <select name="location_id" required><option value="">Selecciona una sede</option></select>
        </label>
        <button class="btn primary" type="submit" disabled>Guardar salida</button>
      </form>
      <p id="formStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../../../inventory.js"></script>
  <script src="../../../inventory-pages.js"></script>
</body>
</html>
