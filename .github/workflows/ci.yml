name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BRASALAND_TEST_DATABASE_URL: sqlite:////tmp/brasaland-ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Check Python locks
        run: |
          uv lock --check
          uv lock --check --project services/api
      - name: Install Python dependencies
        run: uv sync --locked --no-install-project
      - name: Run backend tests
        run: uv run --locked pytest -q --cov=services/api --cov=services/routers/inventory --cov-report=term-missing
      - name: Check Python syntax
        run: uv run --locked python -c "import ast, pathlib; files=list(pathlib.Path('.').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files if '.venv' not in p.parts and 'node_modules' not in p.parts]; print(f'Validated {len(files)} Python files')"
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --runInBand
      - name: Check JavaScript syntax
        run: find uis -name '*.js' -print0 | xargs -0 -n1 node --check
