<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de inventario | Brasaland Backoffice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body data-inventory-page="orders">
  <div class="grain"></div>
  <header class="topbar">
    <h1>Brasaland Ops Console</h1>
    <nav class="menu inventory-nav" aria-label="Navegación de inventario">
      <a href="../products/">Productos</a>
      <a href="inbound/">Entrada</a>
      <a href="outbound/">Salida</a>
      <a href="./" aria-current="page">Historial</a>
      <p id="currentUser" class="current-user"></p>
      <button id="logoutBtn" class="btn" type="button">Cerrar sesión</button>
      <a href="../../index.html" class="ghost-link">Backoffice</a>
    </nav>
  </header>
  <main class="layout inventory-layout">
    <section class="panel inventory-panel">
      <div class="inventory-heading">
        <div><p class="eyebrow">Operaciones / Inventario</p><h2>Historial de órdenes</h2></div>
        <div class="inventory-actions">
          <a class="btn" href="inbound/">Nueva entrada</a>
          <a class="btn" href="outbound/">Nueva salida</a>
        </div>
      </div>
      <p class="muted">Consulta de solo lectura de entradas y salidas registradas.</p>
      <p id="pageStatus" class="status" role="status" aria-live="polite">Cargando historial...</p>
      <div class="table-wrap inventory-table-wrap">
        <table id="ordersTable" class="inventory-table">
          <thead><tr><th>Producto</th><th>Cantidad</th><th>Movimiento</th><th>Fecha</th><th>Usuario</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="../../inventory.js"></script>
  <script src="../../inventory-pages.js"></script>
</body>
</html>
