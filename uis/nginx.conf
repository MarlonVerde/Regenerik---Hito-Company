
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|mjs|json|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}

server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|mjs|json|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
